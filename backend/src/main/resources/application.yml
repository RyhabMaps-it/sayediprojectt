server:
  port: 8088

spring:
  application:
    name: sayadi-ecommerce
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:sayadi_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:sayadiGroupSecretKeyForJwtSigningChangeMeInProduction2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:4200}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@sayadi.tn}
    admin-password: ${ADMIN_PASSWORD:Admin@1959}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
