@if (files?.length) {
  <div class="thumbs" [class.sm]="size === 'sm'">
    @for (file of files; track file; let i = $index) {
      @if (isPdf(file)) {
        <a class="thumb thumb-pdf" [href]="resolveImageUrl(file)" target="_blank" rel="noopener" title="Ouvrir le PDF">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span>PDF</span>
        </a>
      } @else {
        <a class="thumb" [href]="resolveImageUrl(file)" target="_blank" rel="noopener" title="Voir en grand">
          <img [src]="resolveImageUrl(file)" alt="" loading="lazy" />
        </a>
      }
    }
  </div>
} @else if (size === 'sm') {
  <span class="none">—</span>
}
