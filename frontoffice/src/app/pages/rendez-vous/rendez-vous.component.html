<section class="contact-hero">
  <div class="container">
    <span class="eyebrow">{{ 'appointment.eyebrow' | t }}</span>
    <h1>{{ 'appointment.title' | t }}</h1>
    <p>{{ 'appointment.intro' | t }}</p>
  </div>
</section>

<section class="section">
  <div class="container narrow">
    <div class="card form-card">
      @if (sent()) {
        <div class="success-panel">
          <div class="success-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <h3>{{ 'appointment.sentTitle' | t }}</h3>
          <p>{{ 'appointment.sentText' | t }}</p>
        </div>
      } @else {
        <form (ngSubmit)="submit()">
          @if (error()) {
            <p class="alert alert-error">{{ error() }}</p>
          }
          <div class="form-row">
            <div class="form-field">
              <label>{{ 'common.fullName' | t }}</label>
              <input type="text" [(ngModel)]="form.name" name="name" required />
            </div>
            <div class="form-field">
              <label>{{ 'common.email' | t }}</label>
              <input type="email" [(ngModel)]="form.email" name="email" required />
            </div>
          </div>
          <div class="form-field">
            <label>{{ 'common.phone' | t }}</label>
            <input type="tel" [(ngModel)]="form.phone" name="phone" />
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>{{ 'appointment.date' | t }}</label>
              <input type="date" [(ngModel)]="form.date" name="date" [min]="minDate" required />
            </div>
            <div class="form-field">
              <label>{{ 'appointment.time' | t }}</label>
              <select [(ngModel)]="form.time" name="time" required>
                <option value="" disabled selected>{{ 'appointment.chooseTime' | t }}</option>
                @for (t of availableTimes; track t) {
                  <option [value]="t">{{ t }}</option>
                }
              </select>
            </div>
          </div>
          <div class="form-field">
            <label>{{ 'appointment.messageOptional' | t }}</label>
            <textarea rows="3" [(ngModel)]="form.message" name="message"></textarea>
          </div>
          <div class="form-field">
            <label>{{ 'appointment.attachments' | t }} <span class="optional">{{ 'common.optional' | t }}</span></label>
            <app-attachment-drop (urlsChange)="attachments = $event" (busyChange)="uploading.set($event)" />
          </div>
          <button class="btn btn-primary" type="submit" [disabled]="submitting() || uploading()">
            {{ (submitting() ? 'common.sending' : uploading() ? 'common.sendingFiles' : 'appointment.send') | t }}
          </button>
        </form>
      }
    </div>
  </div>
</section>
