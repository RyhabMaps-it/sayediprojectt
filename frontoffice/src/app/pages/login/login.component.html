<section class="auth-page">
  <div class="auth-visual">
    <img [src]="visualImage" alt="" />
    <div class="auth-visual-overlay"></div>
    <div class="auth-visual-content">
      <span class="eyebrow">{{ 'common.sinceEyebrow' | t }}</span>
      <h1>{{ 'auth.loginVisualTitle' | t }}</h1>
      <p>{{ 'auth.loginVisualText' | t }}</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <a routerLink="/" class="auth-logo">
        <img src="/images/sayadi-logo.png" alt="Sayadi Group" />
      </a>

      <h2>{{ 'auth.loginTitle' | t }}</h2>
      <p class="subtitle">{{ 'auth.loginSubtitle' | t }}</p>

      @if (error()) {
        <p class="alert alert-error">{{ error() }}</p>
      }

      <form (ngSubmit)="submit()">
        <div class="form-field">
          <label>{{ 'common.email' | t }}</label>
          <input type="email" [(ngModel)]="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-field">
          <label>{{ 'auth.password' | t }}</label>
          <input type="password" [(ngModel)]="password" name="password" required autocomplete="current-password" />
        </div>
        <button class="btn btn-primary full-width" type="submit" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner"></span>
          }
          {{ (loading() ? 'auth.loggingIn' : 'auth.login') | t }}
        </button>
      </form>

      <p class="switch-link">
        {{ 'auth.noAccount' | t }} <a routerLink="/inscription">{{ 'auth.createAccount' | t }}</a>
      </p>
    </div>
  </div>
</section>
